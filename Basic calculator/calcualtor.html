<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator Project</title>
  <link rel="stylesheet" href="stylee.css">
</head>
<body>

  <!-- Marquee Header -->
  <marquee behavior="scroll" direction="left" class="marquee-banner">
    💡 Welcome to the Stylish Calculator | Web Development Project 2 🎓
  </marquee>

  <!-- Calculator -->
  <div class="calculator">
    <img src="C:\Users\anilp\Documents\anitha\Basic calculator\cal.jpg" alt="Calculator Icon">
    <h2>CALCULATOR</h2>
    <div id="display"></div>
    <div class="buttons">
      <button class="btn-gray" onclick="clearDisplay()">C</button>
      <button class="btn-gray" onclick="deleteLast()">DEL</button>
      <button class="btn-orange" onclick="appendValue('%')">%</button>
      <button class="btn-orange" onclick="appendValue('+')">+</button>

      <button class="btn-gray" onclick="appendValue('7')">7</button>
      <button class="btn-gray" onclick="appendValue('8')">8</button>
      <button class="btn-gray" onclick="appendValue('9')">9</button>
      <button class="btn-orange" onclick="appendValue('-')">−</button>

      <button class="btn-gray" onclick="appendValue('4')">4</button>
      <button class="btn-gray" onclick="appendValue('5')">5</button>
      <button class="btn-gray" onclick="appendValue('6')">6</button>
      <button class="btn-orange" onclick="appendValue('*')">×</button>

      <button class="btn-gray" onclick="appendValue('1')">1</button>
      <button class="btn-gray" onclick="appendValue('2')">2</button>
      <button class="btn-gray" onclick="appendValue('3')">3</button>
      <button class="btn-orange" onclick="appendValue('/')">÷</button>

      <button class="btn-gray" onclick="appendValue('0')">0</button>
      <button class="btn-gray" onclick="appendValue('00')">00</button>
      <button class="btn-gray" onclick="appendValue('.')">.</button>
      <button class="btn-orange" onclick="calculateResult()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
